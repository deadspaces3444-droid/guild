<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гильдия — Списки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚔️ Управление гильдией</h1>
        <div class="auth-box">
            <span id="userInfo"></span>
            <button id="loginBtn">🔐 Войти</button>
            <button id="logoutBtn" style="display:none">🚪 Выйти</button>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab active" data-tab="enemies">🔴 Враги гильдии</button>
        <button class="tab" data-tab="friends">🟢 Друзья (содействие)</button>
        <button class="tab" data-tab="neutral">⚪ Нейтралитет</button>
        <button class="tab" data-tab="personal">🟡 Не трогать</button>
    </nav>

    <main>
        <!-- Форма добавления — видна только админу -->
        <section class="add-form admin-only" style="display:none">
            <input type="text" id="nickname" placeholder="Никнейм игрока" maxlength="32">
            <input type="text" id="note" placeholder="Заметка (необязательно)" maxlength="120">
            <button id="addBtn">➕ Добавить</button>
            <span id="status"></span>
        </section>

        <section id="tab-enemies" class="tab-content active">
            <h2>🔴 Враги гильдии</h2>
            <ul id="list-enemies" class="player-list"></ul>
        </section>

        <section id="tab-friends" class="tab-content">
            <h2>🟢 Друзья гильдии — полное содействие</h2>
            <ul id="list-friends" class="player-list"></ul>
        </section>

        <section id="tab-neutral" class="tab-content">
            <h2>⚪ Нейтралитет</h2>
            <ul id="list-neutral" class="player-list"></ul>
        </section>

        <section id="tab-personal" class="tab-content">
            <h2>🟡 Индивидуальный список — не трогать</h2>
            <ul id="list-personal" class="player-list"></ul>
        </section>
    </main>

    <!-- Модальное окно логина -->
    <div id="loginModal" class="modal" style="display:none">
        <div class="modal-content">
            <h2>🔐 Вход администратора</h2>
            <input type="email" id="email" placeholder="Email" autocomplete="username">
            <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
            <div class="modal-actions">
                <button id="doLogin">Войти</button>
                <button id="cancelLogin" class="secondary">Отмена</button>
            </div>
            <p id="loginError" class="error"></p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
